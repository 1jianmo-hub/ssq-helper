name: 云端构建 APK

# 触发方式：手动在仓库页面点 "Run workflow"；推送代码到 main/master 也会自动触发
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（Capacitor 6 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 34 并接受协议
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          accept-android-sdk-licenses: true

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 npm 依赖
        run: npm install

      - name: 生成安卓原生工程（若仓库中不存在）
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: 同步前端资源与插件
        run: npx cap sync android

      - name: 编译调试 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ssq-picker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
